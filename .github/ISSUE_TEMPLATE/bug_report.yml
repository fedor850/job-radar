name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "**Never paste secrets.env, tokens, or your profile.** Remove personal data from logs."
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines (`deploy.sh logs 200`)
      render: text
  - type: input
    id: version
    attributes:
      label: Version / commit
      placeholder: v1.0.0 or git rev-parse --short HEAD
  - type: input
    id: region
    attributes:
      label: City / country preset
