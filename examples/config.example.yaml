# ===================================================================
#  Job Radar — settings. Secrets (tokens, API keys) live separately in secrets.env.
#  Several settings can be changed right from Telegram (/minscore, /prefs, /pause).
#  This example is the Vienna / Austria preset of the original author — see docs/adapting.md for other places.
# ===================================================================

candidate:                   # who is looking for a job (used in prompts, e-mail drafts, signature)
  name: Alex Example
  pitch: "B2B sales experience (met a EUR 50k monthly target), Excel/automation, top 10% GPA, available 20 h/week from December."   # 1–2 lines for follow-up e-mail drafts
  claude_project: job search  # name of your Claude project that writes CVs (shown in the bot)
  target_weekly_hours: 20      # hours you want (salary is pro-rated to these hours)
  max_weekly_hours: 25         # more than this = "full-time" stop factor (remove fulltime_only from filters.blocking to allow any hours)
  min_monthly_salary: 1200     # EUR gross for target_weekly_hours; below → 💶 note (never a stop factor)

location:
  city: Vienna
  country_code: AT
  home_patterns: []            # regexes for your search area; empty = built-in Vienna list (city, districts, suburbs)
  # home_patterns: ['berlin', 'potsdam', '1[0-4]\d{3} berlin']   # example for Berlin
  # country_patterns: ['germany', 'deutschland', 'de']           # "remote, <country>" counts as in the area

general:
  timezone: Europe/Vienna
  log_level: INFO
  bootstrap_hours: 48        # ads younger than 48 h from a new site/source are treated as new (with sound)
  new_source_days: 10        # older ones (up to 10 days) are evaluated and delivered silently
  max_age_days: 10           # HARD: ads published more than 10 days ago are never interesting
  backfill_days: 10          # default window of /backfill
  backfill_batch: 25         # how many of the best jobs /backfill sends at once
  keep_text_days: 60         # text of unsent ads older than 60 days is deleted (the row stays for duplicate detection)

ai:
  triage: true               # cheap pre-filter on the title
  triage_model: claude-haiku-5-5
  score_model: claude-haiku-5-5
  email_model: claude-haiku-5-5
  text_model: claude-haiku-5-5
  score_effort: low
  score_thinking: true
  score_max_tokens: 3000
  max_description_chars: 9000
  concurrency: 4
  feedback_examples: 20      # how many of your latest reactions are shown to the AI for calibration
  monthly_budget_usd: 10     # = your limit in the Anthropic console; the bot warns at 70% / forecast above the limit and at 90%
  why_example: "B2B sales: met a EUR 50k monthly target — matches the ad's sales-quota requirement"   # style example for the "why it fits" lines
  extra_scoring_rules:       # optional extra rules for the scoring prompt (inserted as is)
    - 'Summer internships (Sommerpraktikum / Ferialpraktikum / summer analyst, start June–Sept 2027) are a priority: a far-future start date is never a risk or a reason to lower the score; mention "summer internship 2027" in why when it is one. Hours/German/field rules still apply.'

filters:
  min_score: 40              # notification threshold (change with /minscore)
  # Stop factors that hide a job completely (remove one to turn that rule off, e.g. german_required / german_ad
  # outside German-speaking countries, fulltime_only if you look for full-time work):
  blocking: [fulltime_only, german_required, german_ad, senior, wrong_field, not_vienna, eu_only, not_eligible, expired]
  # Obviously irrelevant titles — dropped without AI (regular expressions, case-insensitive)
  title_exclude:
    - '\b(senior|sr\.|principal|staff engineer|director|direktor|head of|vice president|vp|chief|cfo|ceo|cto|coo)\b'
    - '\b(teamleit\w*|teamleader|team lead|abteilungsleit\w*|bereichsleit\w*|filialleit\w*|leiter|leiterin)\b'
    - '\b(arzt|[äa]rztin|fach[äa]rzt|pflege|krankenpfleg|diplomierte|hebamme|therapeut|ordinationsassist|zahnarzt|apotheker)'
    - '\b(koch|k[öo]chin|kellner|servicekraft|barkeeper|abwasch|k[üu]chenhilfe|sushi|pizza|backstube|b[äa]cker)'
    - '\b(reinigung|raumpfleg|hausbesorg|haustechnik|elektriker|elektroniker|installateur|monteur|mechaniker|mechatroniker|schlosser|tischler|maurer|polier|maler und|spengler|dachdecker|schwei[ßs]er)'
    - '\b(lagerarbeit|kommissionier|staplerfahrer|lkw|fahrer|chauffeur|zusteller|kurier)'
    - '\b(lehrling|lehrstelle|lehre als|lehre zum|lehre zur|lehre nach der matura|sch[üu]ler)'
    - '\b(friseur|nageldesign|masseur|fitnesstrainer|bademeister|sicherheitsdienst|wachdienst|security guard)'
    - '\b(kindergarten|elementarp[äa]d|p[äa]dagog|tagesmutter|kinderbetreu)'
  company_exclude: []
  # Companies whose working language is English (regexes on the company name): their German-language ads WITHOUT
  # German requirements are not hidden but delivered with a note "ask the recruiter". German above B1 still blocks.
  english_workplace:
    - 'united nations|\bun\b|\bunov\b|unodc|unoosa|uncitral|unido|iaea|\bosce\b|ctbto|opec|iiasa|icmpd|seforall|sustainable energy for all'
    - 'anti-corruption academy|\biaca\b|energy community|wassenaar|international press institute|vcdnp|unhcr|\biom\b|international organization for migration'
    - 'unicef|\bundp\b|\bunep\b|world bank|\bebrd\b|\bifc\b|fundamental rights agency'
    - 'central european university|\bceu\b|webster|modul university|\bista\b|institute of science and technology austria|complexity science hub'
    - 'bitpanda|sportradar|\bn26\b|sumup|\bwolt\b|too good to go|deepl|refurbed|bitmovin|storyblok|planradar|adverity|tourradar|dynatrace'
    - 'prewave|fiskaly|gropyus|\bxund\b|nyra health|fonio|hydrogrid|mostly ai|anyline|craftworks|kickscale|\bbyrd\b|scalable capital|datadog|snowflake'

links:
  resolve: true              # look for the ad on the company's own site if it came from LinkedIn / a job board
  search_min_score: 60       # Claude web search (paid, ~$0.02) — only for scores ≥ 60
  search_daily_cap: 12
  search_model: claude-haiku-5-5

# Jooble / Careerjet return only a snippet of the description, and their pages are closed to servers.
# The bot looks for the original (same job from another source → company site/ATS → JOIN). If not found:
snippet:
  web_search: true           # paid web search for the original (~$0.02) — only for jobs that would pass the threshold
  search_daily_cap: 8        # at most 8 per day (≈ $5/month maximum)
  # without the full text a job is sent only if the title/snippet clearly says part-time / student role

referrals:
  linkedin_school_ids: ["15091531"]   # your universities' LinkedIn IDs (alumni buttons); 15091531 = WU Vienna
  alumni_label: WU alumni   # button text

tracker:
  followup_days: 7
  no_response_days: 35

nudge:
  enabled: true              # in the evening (20:30) remind about strong jobs you did not react to
  min_score: 75

mail:
  interval_sec: 300
  initial_days: 3

health:
  alert_after_fails:
    default: 4
    linkedin: 6
    boards: 6
    gmail: 4

# ------------------------------------------------------------------- sources
sources:
  linkedin:
    enabled: true
    interval_sec: 360        # every 6 minutes (the 3 h window overlaps with margin; less often → fewer LinkedIn limits)
    # LinkedIn shows a job in search with a delay, so the window is 3 hours (duplicates are dropped automatically).
    window_sec: 10800
    max_pages: 8
    delay_sec: [2.0, 4.0]    # pause between requests (avoids blocking)
    cooldown_sec: 900        # after "429 Too Many Requests": pause 15 min, repeated → 30 → 60 min
    cooldown_max_sec: 3600
    detail_delay_sec: [1.5, 3.0]   # pause before loading each job
    sweep_per_run: 1         # keyword "sweep" searches per run (at night)
    sweep_night: [20, 7]     # sweep from 20:00 to 07:00 (during the day LinkedIn throttles data-centre IPs)
    day_sweep_every: 5       # during the day only every 5th run (≈ every 30 min)
    queries:
      - {keywords: "", location: "Vienna, Vienna, Austria", distance: 25}
      - {keywords: "remote", location: "Austria", require_remote: true, window_sec: 21600, max_pages: 3}
      # keyword sweep (24 h window, one query per run → a full round ≈ 2.5 h)
      - {sweep: true, keywords: "intern", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "praktikum", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "werkstudent", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "working student", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "student", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "trainee", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "graduate", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "junior", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "part time", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "teilzeit", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "analyst", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "assistant", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "business development", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "sales", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "marketing", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "finance", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "consulting", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "operations", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "spanish", location: "Vienna, Vienna, Austria", distance: 25}   # your languages
      - {sweep: true, keywords: "CEE", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "english", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "data analyst", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "business analyst", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "product", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "customer success", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "HR", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "recruiting", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "communications", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "procurement", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "supply chain", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "ESG", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "compliance", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "startup", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "founders associate", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "ukrainian", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "praktikant", location: "Vienna, Vienna, Austria", distance: 25}
      - {sweep: true, keywords: "studentische", location: "Vienna, Vienna, Austria", distance: 25}
      # summer internships 2027 — 10-day window to catch ads that are already open
      - {sweep: true, keywords: "summer internship", location: "Vienna, Vienna, Austria", distance: 25, window_sec: 864000, max_pages: 3}
      - {sweep: true, keywords: "sommerpraktikum", location: "Vienna, Vienna, Austria", distance: 25, window_sec: 864000, max_pages: 3}
      - {sweep: true, keywords: "summer analyst", location: "Vienna, Vienna, Austria", distance: 25, window_sec: 864000, max_pages: 3}
      - {sweep: true, keywords: "summer associate", location: "Vienna, Vienna, Austria", distance: 25, window_sec: 864000, max_pages: 3}
      - {sweep: true, keywords: "ferialpraktikum", location: "Vienna, Vienna, Austria", distance: 25, window_sec: 864000, max_pages: 3}
      - {sweep: true, keywords: "summer 2027", location: "Vienna, Vienna, Austria", distance: 25, window_sec: 864000, max_pages: 3}
      - {sweep: true, keywords: "praktikum sommer 2027", location: "Vienna, Vienna, Austria", distance: 25, window_sec: 864000, max_pages: 3}
  indeed:
    enabled: true
    interval_sec: 300
    hours_old: 2
    results_wanted: 80
    country: Austria
    queries:
      - {search_term: "", location: "Wien", distance: 25}
      # summer internships: 10-day window, at most every 3 hours
      - {search_term: "summer internship", location: "Wien", distance: 25, hours_old: 240, results: 50, min_interval_sec: 10800}
      - {search_term: "sommerpraktikum", location: "Wien", distance: 25, hours_old: 240, results: 50, min_interval_sec: 10800}
      - {search_term: "summer analyst", location: "Wien", distance: 25, hours_old: 240, results: 50, min_interval_sec: 10800}
      - {search_term: "ferialpraktikum", location: "Wien", distance: 25, hours_old: 240, results: 50, min_interval_sec: 10800}
  karriere:
    enabled: true
    interval_sec: 300
    pages: 3
    location_slug: wien
  zbp:
    enabled: true
    interval_sec: 900
  jobsat:                    # jobs.at — many ads of international companies (often in English)
    enabled: true
    interval_sec: 1200       # every 20 minutes: ~25 keyword queries
    location_slug: wien
  willhaben:                 # willhaben Jobs — large Austrian classifieds site
    enabled: true
    interval_sec: 3600       # may answer 403 to data-centre IPs → checked hourly
    pages: 3
    location: Wien
  jooble:                  # key in secrets.env (JOOBLE_API_KEY); a free key has 500 requests in total
    interval_sec: 43200    # every 12 hours
    keywords_per_run: 1    # 1 query per run = 2 per day (lasts ~7 months)
    request_cap: 440       # hard cap, the rest is a reserve
  careerjet:               # key in secrets.env (CAREERJET_API_KEY)
    interval_sec: 1800
    referer: https://example.com/   # the website you registered the key with
    user_ip: 203.0.113.10            # your server's public IP
    keywords_per_run: 3    # ×2 locales = 6 queries per run
  derstandard:               # DER STANDARD Jobs — banks, OeNB/FMA, international companies
    enabled: true
    interval_sec: 1200
    location_slug: wien
  # ---- generic sites (list page → job page with schema.org JobPosting)
  sites:
    - name: adzuna             # aggregator: collects jobs from company sites and small job boards
      label: Adzuna
      interval_sec: 900
      urls:
        - "https://www.adzuna.at/search?w=Wien&sb=date&p={page}"
        - "https://www.adzuna.at/search?q={kw}&w=Wien&sb=date"
      pages: 4
      keywords: [praktikum, praktikant, intern, internship, werkstudent, "working student", student, trainee,
                 junior, graduate, english, teilzeit, "part time", polnisch, russisch,
                 "summer internship", sommerpraktikum, ferialpraktikum]
      link: 'adzuna\.at/details/(?P<id>\d+)'
      detail: "https://www.adzuna.at/details/{id}"
      apply_link: 'href="(https://www\.adzuna\.at/land/ad/\d+[^"]*)"'
      max_details: 60
    - name: xing               # XING Jobs (DACH)
      label: XING Jobs
      interval_sec: 1200
      urls: ["https://www.xing.com/jobs/search?keywords={kw}&location=Wien"]
      keywords: [praktikum, praktikant, werkstudent, student, intern, internship, trainee, junior, graduate,
                 english, teilzeit, "business development", sales, marketing, finance, controlling, consulting,
                 "summer internship", sommerpraktikum, ferialpraktikum]
      link: 'href="(?P<url>/jobs/[a-z0-9\-]+-(?P<id>\d{6,}))"'
      max_details: 50
    - name: iagora             # internships in English for international students
      label: iAgora
      interval_sec: 1800
      urls: ["https://www.iagora.com/work/en/internships-vienna", "https://www.iagora.com/work/en/internships-vienna?offset=50",
             "https://www.iagora.com/work/en/jobs-vienna"]
      link: '(?P<url>https://www\.iagora\.com/work/en/offer/[a-z0-9\-]+/(?P<id>\d+))'
      main_selector: "main"
      company_regex: '^[^\n]*\n\n([^\n]{2,80})\n\n[^\n]*Austria'   # the company is plain text under the title
    - name: workinaustria      # Work in Austria (ABA) — platform for international professionals
      label: Work in Austria
      interval_sec: 1800
      urls: ["https://www.workinaustria.com/en/employees/jobs/"]
      link: 'jobdetail/(?P<id>\d+)/(?P<slug>[a-z0-9\-]+)'
      detail: "https://www.workinaustria.com/en/employees/jobs/jobdetail/{id}/{slug}"
    - name: wujobs             # jobs at WU Vienna itself (student assistants, projects, institutes)
      label: WU Jobs
      company: "WU Wien"
      interval_sec: 3600
      urls: ["https://jobs.wu.ac.at", "https://jobs.wu.ac.at/eng"]
      link: '(?P<url>https://jobs\.wu\.ac\.at/[^"\s]+-j(?P<id>\d+)\.html)'
  boards:
    enabled: true
    interval_sec: 360        # ~140 company sites every 6 min
    workers: 8

